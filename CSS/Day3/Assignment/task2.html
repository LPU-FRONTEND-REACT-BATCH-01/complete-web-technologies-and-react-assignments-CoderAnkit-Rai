<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>React Navbar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #23272f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .navbar {
    display: flex;
    align-items: center;
    background: #23272f;
    height: 58px;
    padding: 0 16px;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  /* ── Logo ── */
  .logo {
    display: flex;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .logo svg {
    width: 32px;
    height: 32px;
  }

  .logo-version {
    font-size: 12.5px;
    color: #6e7a8a;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  /* ── Search ── */
  .search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2b3040;
    border: 1px solid #3a4155;
    border-radius: 20px;
    height: 36px;
    width:700px;
    padding: 0 12px;
    cursor: text;
   /* min-width: 0;*/

  }

  .search svg {
    width: 15px;
    height: 15px;
    color: #6e7a8a;
    flex-shrink: 0;
     
  }

  .search-text {
    flex: 1;
    font-size: 13px;
    color: #6e7a8a;
    user-select: none;
   
  }

  .shortcut {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .shortcut kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #1e222c;
    border: 1px solid #3a4155;
    border-radius: 5px;
    font-size: 11.5px;
    font-family: inherit;
    color: #8c98aa;
    padding: 2px 7px;
    line-height: 1.5;
    font-weight: 500;
  }

  /* ── Nav links ── */
  .nav-links {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    color:rgb(245, 242, 242)
    
  }

  .nav-link {
    color: #d6dce6;
    text-decoration: none;
    font-size: 15.5px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    white-space: nowrap;
    letter-spacing: -0.01em;
    transition: color 0.12s, background 0.12s;
  }

  .nav-link:hover {
    color: #fff;
    background: rgba(255,255,255,0.07);
  }

  /* ── Icon buttons ── */
  .icons {
    display: flex;
    align-items: center;
    gap: 1px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #6e7a8a;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.12s, background 0.12s;
  }

  .icon-btn:hover {
    color: #d6dce6;
    background: rgba(255,255,255,0.07);
  }

  /* Sun icon */
  .icon-btn.sun svg {
    width: 19px;
    height: 19px;
  }

  /* Translate icon — using text glyphs like react.dev does */
  .icon-btn.lang {
    font-size: 17px;
    font-weight: 600;
    color: #6e7a8a;
    letter-spacing: -1px;
  }

  .icon-btn.lang:hover {
    color: #d6dce6;
  }

  /* GitHub icon */
  .icon-btn.github svg {
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<nav class="navbar">

  <!-- Logo -->
  <a class="logo" href="#">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="50" rx="46" ry="17.5" stroke="#087ea4" stroke-width="6" fill="none"/>
      <ellipse cx="50" cy="50" rx="46" ry="17.5" stroke="#087ea4" stroke-width="6" fill="none" transform="rotate(60 50 50)"/>
      <ellipse cx="50" cy="50" rx="46" ry="17.5" stroke="#087ea4" stroke-width="6" fill="none" transform="rotate(120 50 50)"/>
      <circle cx="50" cy="50" r="8" fill="#087ea4"/>
    </svg>
    <span class="logo-version">v19.2</span>
  </a>

  <!-- Search bar (stretches to fill space) -->
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7.5"/>
      <line x1="20" y1="20" x2="15.8" y2="15.8"/>
    </svg>
    <span class="search-text">Search</span>
    <div class="shortcut">
      <kbd>Ctrl</kbd>
      <kbd>K</kbd>
    </div>
  </div>

  <!-- Nav links -->
  <nav class="nav-links">
    <a class="nav-link" href="#">Learn</a>
    <a class="nav-link" href="#">Reference</a>
    <a class="nav-link" href="#">Community</a>
    <a class="nav-link" href="#">Blog</a>
  </nav>

  <!-- Icons -->
  <div class="icons">

    <!-- Sun / theme toggle -->
    <button class="icon-btn sun" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.5"/>
        <line x1="12" y1="2"  x2="12" y2="4.5"/>
        <line x1="12" y1="19.5" x2="12" y2="22"/>
        <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="2"  y1="12" x2="4.5"  y2="12"/>
        <line x1="19.5" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="19.78"  x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
      </svg>
    </button>

    <!-- Language — 文A style like react.dev -->
    <button class="icon-btn lang" title="Language">
      <span style="font-size:15px; font-weight:600; color:inherit; font-family: sans-serif; letter-spacing:-1px;">文A</span>
    </button>

    <!-- GitHub -->
    <button class="icon-btn github" title="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
    </button>

  </div>

</nav>

</body>
</html>
