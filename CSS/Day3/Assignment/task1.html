<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Navbar</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.navbar {
  display: flex;                   
  align-items: end;            
  background-color: black;
  padding: 15px 30px;
}


.logo {
  color: white;
  font-size: 20px;
  font-weight: bold;
}

/* Links container */
.nav-links {
  display: flex;                 
  gap: 20px;
  margin-left: auto;            
}

/* Links style */
.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 16px;
}

.nav-links a:hover {
  color: yellow;
}

body {
  height: 1000px;
}
</style>

</head>
<body>

<div class="navbar">
  <div class="logo">MySite</div>

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</div>

</body>
</html>
