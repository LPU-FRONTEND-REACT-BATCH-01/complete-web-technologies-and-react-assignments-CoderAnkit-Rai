<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position + Flex Navbar</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


.navbar {
  display: flex;                     
  justify-content: space-between;   
  align-items: center;              
  background-color: black;
  color: white;
  padding: 15px 30px;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

.nav-links {
  display: flex;                   
  gap: 20px;                        
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 16px;
}

.nav-links a:hover {
  color: yellow;
}




body {
  height: 1000px;
}
</style>

</head>
<body>

<div class="navbar">
  <div class="logo">MySite</div>

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</div>


</body>
</html>
