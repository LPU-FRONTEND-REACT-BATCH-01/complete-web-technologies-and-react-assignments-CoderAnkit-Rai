          <td style="border: 1px solid black; padding: 8px;">92</td>
        </tr>
        <tr>
          <td style="border: 1px solid black; padding: 8px;">Bob Johnson</td>
          <td style="border: 1px solid black; padding: 8px;">78</td>
        </tr>

          <td style="border: 1px solid black; padding: 8px;">Alice Brown</td>
          <td style="border: 1px solid black; padding: 8px;">96</td>
        </tr>
      </tbody>
    </table>
</body>
</html>
